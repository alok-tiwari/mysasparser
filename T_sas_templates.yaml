    class SASErrorHandler:
        """Complete error handling and validation system."""
        def __init__(self):
            self.errors = []
            self.warnings = []
            self.notes = []
            self.log_file = None
        
        def set_log_file(self, path: str):
            """Set log file path."""
            self.log_file = path
            with open(path, 'w') as f:
                f.write("SAS to Python Conversion Log\n")
                f.write("=" * 50 + "\n\n")
        
        def add_error(self, component: str, message: str, details: Dict = None):
            """Add error message."""
            error = {
                'timestamp': datetime.now(),
                'component': component,
                'message': message,
                'details': details or {}
            }
            self.errors.append(error)
            self._write_to_log('ERROR', error)
        
        def add_warning(self, component: str, message: str, details: Dict = None):
            """Add warning message."""
            warning = {
                'timestamp': datetime.now(),
                'component': component,
                'message': message,
                'details': details or {}
            }
            self.warnings.append(warning)
            self._write_to_log('WARNING', warning)
        
        def add_note(self, component: str, message: str, details: Dict = None):
            """Add informational note."""
            note = {
                'timestamp': datetime.now(),
                'component': component,
                'message': message,
                'details': details or {}
            }
            self.notes.append(note)
            self._write_to_log('NOTE', note)
        
        def _write_to_log(self, level: str, message: Dict):
            """Write message to log file."""
            if self.log_file:
                with open(self.log_file, 'a') as f:
                    f.write(f"{message['timestamp']} - {level}: {message['component']}\n")
                    f.write(f"  {message['message']}\n")
                    if message['details']:
                        f.write(f"  Details: {message['details']}\n")
                    f.write("\n")
        
        def get_summary(self) -> Dict[str, int]:
            """Get summary of messages."""
            return {
                'errors': len(self.errors),
                'warnings': len(self.warnings),
                'notes': len(self.notes)
            }
        
        def has_errors(self) -> bool:
            """Check if there are any errors."""
            return len(self.errors) > 0

    class SASValidator:
        """Validation rules for SAS components."""
        @staticmethod
        def validate_dataset_name(name: str) -> bool:
            """Validate SAS dataset name."""
            if not name:
                return False
            pattern = re.compile(r'^[a-zA-Z_][a-zA-Z0-9_]*$')
            return bool(pattern.match(name)) and len(name) <= 32
        
        @staticmethod
        def validate_variable_name(name: str) -> bool:
            """Validate SAS variable name."""
            if not name:
                return False
            pattern = re.compile(r'^[a-zA-Z_][a-zA-Z0-9_]*$')
            return bool(pattern.match(name)) and len(name) <= 32
        
        @staticmethod
        def validate_format(format_str: str) -> bool:
            """Validate SAS format specification."""
            pattern = re.compile(r'^(\$?[A-Za-z]+)(\d+)\.?(\d+)?$')
            return bool(pattern.match(format_str))
        
        @staticmethod
        def validate_date_value(value: Any) -> bool:
            """Validate date value."""
            if isinstance(value, (datetime, date)):
                return True
            try:
                pd.to_datetime(value)
                return True
            except:
                return False

