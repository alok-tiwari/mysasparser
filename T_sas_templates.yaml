    class DatasetOperations:
        """Handle dataset operations like PROC DATASETS."""
        @staticmethod
        def append(base_df: pd.DataFrame, data_df: pd.DataFrame, force: bool = False) -> pd.DataFrame:
            """Append datasets like PROC APPEND."""
            if not force and not set(data_df.columns).issubset(set(base_df.columns)):
                raise ValueError("Data columns don't match base columns")
            return pd.concat([base_df, data_df[base_df.columns]], ignore_index=True)
        
        @staticmethod
        def modify(df: pd.DataFrame, modifications: List[Dict]) -> pd.DataFrame:
            """Modify dataset attributes."""
            result = df.copy()
            for mod in modifications:
                if mod['type'] == 'rename':
                    result = result.rename(columns=mod['mapping'])
                elif mod['type'] == 'label':
                    # Store labels in dataframe attributes
                    result.attrs['labels'] = result.attrs.get('labels', {})
                    result.attrs['labels'].update(mod['labels'])
                elif mod['type'] == 'format':
                    result.attrs['formats'] = result.attrs.get('formats', {})
                    result.attrs['formats'].update(mod['formats'])
            return result
        
        @staticmethod
        def delete(lib_path: str, dataset_names: List[str]) -> None:
            """Delete datasets."""
            for name in dataset_names:
                path = os.path.join(lib_path, f"{name}.csv")
                if os.path.exists(path):
                    os.remove(path)

